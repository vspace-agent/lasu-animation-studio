<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f0e9">
  <title>Lasu 🦩 · Visual Gallery</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./gallery.css">
  <script src="./gallery.js" defer></script>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <header class="site-header">
    <span class="studio-label">Mushroom House 🍄 Studio</span>
    <h1>Lasu 🦩</h1>
    <p>Visual Gallery</p>
  </header>
  <main class="workspace gallery-workspace">
    <nav class="steps" aria-label="Studio navigation">
      <a href="./index.html#animate">← Animation</a>
      <a href="./library.html">☁️ Library</a>
      <a href="./gallery.html" aria-current="page">Gallery</a>
      <a href="./publish.html">🎬 Publish</a>
    </nav>
    <section class="panel gallery-panel">
      <h2>Mushroom House Visual Library</h2>
      <p>Explore and download original visual assets from Lasu's public library.</p>
      <div class="gallery-filters">
        <label>Category
          <select id="gallery-category"></select>
        </label>
        <label>Project
          <select id="gallery-project"></select>
        </label>
      </div>
      <p id="gallery-status" role="status" aria-live="polite">Loading gallery…</p>
      <div id="gallery-grid" class="public-gallery-grid"></div>
      <button id="gallery-more" type="button" hidden>Load more</button>
    </section>
  </main>
  <footer>Made in Mushroom House 🍄 Studio</footer>
</body>
</html>
